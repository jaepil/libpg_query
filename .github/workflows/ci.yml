name: CI

on:
  push:
    branches: [18-latest, fix/pg18-4-maintenance]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  build:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [clang, gcc]
        protobuf_lib: [protobuf-c, protobuf-cpp]
        valgrind: [valgrind,no-valgrind]
        exclude:
          # this combination hits linking errors: see https://github.com/pganalyze/libpg_query/pull/289
          - compiler: clang
            protobuf_lib: protobuf-cpp
            valgrind: valgrind
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Cache protobuf library
      if: matrix.protobuf_lib == 'protobuf-cpp'
      id: cache-protobuf
      uses: actions/cache@v4
      with:
        path: protobuf-25.1
        key: ${{ runner.os }}-${{ matrix.compiler }}-protobuf-25.1
    - name: Build protobuf library
      if: matrix.protobuf_lib == 'protobuf-cpp' && steps.cache-protobuf.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v25.1 https://github.com/protocolbuffers/protobuf.git protobuf-25.1
        cd protobuf-25.1
        git submodule update --init --recursive
        cmake .
        cmake --build . --parallel 10
    - name: Install protobuf library
      if: matrix.protobuf_lib == 'protobuf-cpp'
      run: |
        cd protobuf-25.1
        sudo make install
        sudo ldconfig
    - name: Install Valgrind
      if: matrix.valgrind == 'valgrind'
      run: sudo apt update && sudo apt install -y valgrind
    - name: Determine make flags
      id: make_flags
      run: |
        if [ "$PROTOBUF_LIB" = protobuf-cpp ]
        then
          echo "proto_flags=USE_PROTOBUF_CPP=1" >> "$GITHUB_OUTPUT"
        else
          echo "proto_flags=" >> "$GITHUB_OUTPUT"
        fi
        if [ "$COMPILER" = clang ]
        then
          echo "compiler_flags=CC=clang CXX=clang" >> "$GITHUB_OUTPUT"
        elif [ "$COMPILER" = gcc ]
        then
          echo "compiler_flags=CC=gcc CXX=g++" >> "$GITHUB_OUTPUT"
        else
          echo "compiler_flags=" >> "$GITHUB_OUTPUT"
        fi
        if [ "$VALGRIND" = valgrind ]
        then
          echo "debug_flags=VALGRIND=1 DEBUG=1" >> "$GITHUB_OUTPUT"
        else
          echo "debug_flags=" >> "$GITHUB_OUTPUT"
        fi
      env:
        PROTOBUF_LIB: ${{ matrix.protobuf_lib }}
        COMPILER: ${{ matrix.compiler }}
        VALGRIND: ${{ matrix.valgrind }}
    - name: Build and run tests
      run: make $FLAGS
      env:
        FLAGS: ${{ format('{0} {1} {2}', steps.make_flags.outputs.proto_flags, steps.make_flags.outputs.compiler_flags, steps.make_flags.outputs.debug_flags) }}
  build_macos:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and run tests
      run: make
  build_windows_msvc:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
    - name: Configure MSVC developer console
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and run tests
      run: nmake /F Makefile.msvc
  build_windows_msys2:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw64, mingw32, ucrt64, clang64]
    steps:
    - name: Set up MSYS2 and compiler
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        pacboy: >-
          toolchain:p
        install: >-
          make
          diffutils
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and run tests
      shell: msys2 {0}
      run: |
        make

  native_sanitizers:
    name: Native ASan UBSan LSan (${{ matrix.os }})
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CC: clang
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      TEST_LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select upstream LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          if ! brew list llvm >/dev/null 2>&1; then
            brew install llvm
          fi
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Verify generated descriptor callback adapters
        run: python3 scripts/adapt_protobuf_callbacks.py protobuf/pg_query.pb-c.c --check
      - name: Build and execute the complete native test suite
        run: make -j2 test
      - name: Exercise every Protobuf initializer callback
        run: python3 scripts/verify_protobuf_callbacks.py
